<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<title>Voice Assistant</title>
<style>
  :root {
    --bg: #f5f5f4; --fg: #1c1917; --muted: #78716c; --card: #ffffff; --line: #d6d3d1;
    --accent: #2563eb; --live: #16a34a; --stop: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --card: #1c1917; --line: #44403c;
      --accent: #3b82f6; --live: #22c55e; --stop: #ef4444;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, sans-serif;
  }
  header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  #dot.live { background: var(--live); }
  #status { color: var(--muted); flex: 1; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 0 16px; }
  .msg {
    margin: 8px 0; padding: 10px 12px; border-radius: 14px; max-width: 85%; width: fit-content;
    white-space: pre-wrap; overflow-wrap: anywhere;  /* keep the line breaks of lists etc. */
  }
  .msg code { font-family: ui-monospace, monospace; font-size: .92em; background: var(--bg); padding: 0 4px; border-radius: 4px; }
  .you { background: var(--accent); color: #fff; margin-left: auto; }
  .ai { background: var(--card); }
  footer {
    padding: 12px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }
  form { display: flex; gap: 8px; }
  #text {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit;
  }
  #send {
    flex: none; padding: 0 18px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
  }
  #btn {
    width: 100%; padding: 16px; border: 0; border-radius: 14px;
    font: inherit; font-size: 18px; font-weight: 600;
    background: var(--accent); color: #fff;
  }
  #btn.on { background: var(--stop); }
  #wakeRow {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    color: var(--muted); font-size: 15px; padding: 0 4px;
  }
  #wakeRow[hidden] { display: none; }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .slider {
    position: absolute; inset: 0; border-radius: 13px; background: var(--line);
    transition: background .2s; pointer-events: none;
  }
  .slider::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; transition: transform .2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::after { transform: translateX(20px); }
  .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .6; }
</style>
</head>
<body>
<header>
  <span id="dot"></span><span id="status">Connecting…</span>
</header>
<div id="log"></div>
<footer>
  <form id="form">
    <input id="text" type="text" placeholder="Type a message…" autocomplete="off" enterkeyhint="send">
    <button id="send" type="submit">Send</button>
  </form>
  <button id="btn">🎤 Start talking</button>
  <div id="wakeRow" hidden>
    <span id="wakeLabel">Wake word</span>
    <label class="switch">
      <input id="wakeSwitch" type="checkbox" role="switch" aria-labelledby="wakeLabel">
      <span class="slider"></span>
    </label>
  </div>
</footer>

<script>
// Mic -> 16 kHz 16-bit PCM chunks, posted to the main thread
const WORKLET = `
class Mic extends AudioWorkletProcessor {
  constructor() { super(); this.ratio = sampleRate / 16000; this.pos = 0;
                  this.buf = new Int16Array(512); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (; this.pos < ch.length; this.pos += this.ratio) {
      const s = Math.max(-1, Math.min(1, ch[Math.floor(this.pos)]));
      this.buf[this.n++] = s * 32767;
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.buffer.slice(0)); this.n = 0; }
    }
    this.pos -= ch.length;
    return true;
  }
}
registerProcessor('mic', Mic);`;

const $ = id => document.getElementById(id);
const btn = $('btn'), statusEl = $('status'), dot = $('dot'), log = $('log');
const form = $('form'), input = $('text');
const wakeRow = $('wakeRow'), wakeSwitch = $('wakeSwitch'), wakeLabel = $('wakeLabel');

let ws, mic, inCtx, out, wakeLock;
let playTime = 0, sources = [], aiEl = null, aiText = '';
let ignoreAudio = false;  // after "stop", drop late audio until the next reply starts
let wakeName = '';        // e.g. "hey jarvis"; '' = server has no wake word
let wakeMode = false;     // the switch: require the wake word (remembered)
try { wakeMode = localStorage.getItem('wakeMode') === '1'; } catch {}
wakeSwitch.checked = wakeMode;
let replyEnded = false;   // server sent all audio; tell it "played" once the phone is done
let muted = true;         // replies are spoken only while talking (mic on)

function setStatus(text, live = false) { statusEl.textContent = text; dot.classList.toggle('live', live); }

function idleStatus() {
  if (ws?.readyState !== WebSocket.OPEN) return;
  if (mic && wakeName && wakeMode) setStatus(`💤 Say "${wakeName}", then talk`, true);
  else if (mic) setStatus('Listening — talk or type', true);
  else setStatus('Connected — type (silent replies), or tap 🎤 to talk');
}

function add(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// ---- connection (opens on page load, reconnects automatically) ----
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'mute', value: muted }));
    ws.send(JSON.stringify({ type: 'wake_mode', value: wakeMode }));
    idleStatus();
  };
  ws.onmessage = onMessage;
  ws.onclose = () => {
    setStatus('Disconnected — reconnecting…');
    stopPlayback();
    setTimeout(connect, 2000);
  };
}

function onMessage(e) {
  if (typeof e.data !== 'string') return play(e.data);
  const m = JSON.parse(e.data);
  if (m.type === 'hello') {
    wakeName = m.wake;
    wakeRow.hidden = !wakeName;
    wakeLabel.textContent = `Wake word "${wakeName}"`;
    idleStatus();
  }
  else if (m.type === 'wake') onWake(m.state);
  else if (m.type === 'end') { replyEnded = true; reportPlayed(); }
  else if (m.type === 'stop') { ignoreAudio = true; stopPlayback(); }
  else if (m.type === 'user') { add('you', m.text); }
  else if (m.type === 'reply') { ignoreAudio = false; replyEnded = false; aiText = ''; aiEl = add('ai', ''); }
  else if (m.type === 'token' && aiEl) {
    aiText += m.text;
    aiEl.innerHTML = format(aiText);
    log.scrollTop = log.scrollHeight;
  }
}

// ---- voice replies: 24 kHz 16-bit PCM, scheduled back to back ----
// Simple formatting for AI replies: **bold**, `code`, # headings, - / * bullets.
// The text is HTML-escaped first, so nothing the model writes can inject markup.
function format(text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc
    .replace(/^[ \t]*#{1,6}[ \t]+(.+)$/gm, '<b>$1</b>')
    .replace(/^([ \t]*)[-*][ \t]+/gm, '$1• ')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>');
}

// ---- wake word ("Hey Jarvis"): state comes from the server ----
function onWake(state) {
  if (!mic || !wakeMode) return;
  if (state === 'listening') { setStatus('👂 Listening…', true); chime(); }
  else if (state === 'window') setStatus('Go ahead — no wake word needed for a few seconds', true);
  else idleStatus();
}

function chime() {  // short soft tone, same as on the PC
  if (!out || muted) return;
  const osc = out.createOscillator(), gain = out.createGain(), t = out.currentTime;
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.25, t + 0.03);
  gain.gain.linearRampToValueAtTime(0, t + 0.12);
  osc.connect(gain).connect(out.destination);
  osc.start(t); osc.stop(t + 0.13);
}

function reportPlayed() {  // reply fully played -> server opens the follow-up window
  if (replyEnded && !sources.length && ws?.readyState === WebSocket.OPEN) {
    replyEnded = false;
    ws.send(JSON.stringify({ type: 'played' }));
  }
}

function ensureOut() {  // browsers allow audio only after a tap
  if (!out) out = new AudioContext();
  if (out.state === 'suspended') out.resume();
}

function play(buf) {
  if (muted || ignoreAudio || !out) return;
  const pcm = new Int16Array(buf, 0, buf.byteLength >> 1);
  if (!pcm.length) return;
  const audio = out.createBuffer(1, pcm.length, 24000);
  const data = audio.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) data[i] = pcm[i] / 32768;
  const src = out.createBufferSource();
  src.buffer = audio;
  src.connect(out.destination);
  playTime = Math.max(playTime, out.currentTime + 0.03);
  src.start(playTime);
  playTime += audio.duration;
  sources.push(src);
  src.onended = () => { sources = sources.filter(s => s !== src); reportPlayed(); };
}

function stopPlayback() {
  sources.forEach(s => { try { s.stop(); } catch {} });
  sources = [];
  playTime = 0;
}

function setMuted(value) {
  muted = value;
  if (muted) stopPlayback(); else ensureOut();
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'mute', value: muted }));
}

// ---- typing ----
form.onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || ws?.readyState !== WebSocket.OPEN) return;
  ensureOut();
  ws.send(JSON.stringify({ type: 'text', text }));
  input.value = '';
};

// ---- microphone ----
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}

async function startMic() {
  if (!window.isSecureContext) {
    setStatus('Open this page with https:// — the microphone needs it');
    return;
  }
  btn.disabled = true;
  setStatus('Starting microphone…');
  try {
    ensureOut();
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    try { inCtx = new AudioContext({ sampleRate: 16000 }); } catch { inCtx = new AudioContext(); }
    const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
    await inCtx.audioWorklet.addModule(url);
    const node = new AudioWorkletNode(inCtx, 'mic', { numberOfOutputs: 0 });
    inCtx.createMediaStreamSource(mic).connect(node);
    node.port.onmessage = e => { if (ws?.readyState === WebSocket.OPEN) ws.send(e.data); };
    btn.textContent = '■ Stop talking'; btn.classList.add('on');
    setMuted(false);
    keepAwake();
    idleStatus();
  } catch (err) {
    stopMic();
    setStatus(err.name === 'NotAllowedError' ? 'Microphone permission denied' : 'Error: ' + err.message);
  }
  btn.disabled = false;
}

function stopMic() {
  mic?.getTracks().forEach(t => t.stop()); mic = null;
  inCtx?.close(); inCtx = null;
  wakeLock?.release(); wakeLock = null;
  setMuted(true);
  btn.textContent = '🎤 Start talking'; btn.classList.remove('on');
  idleStatus();
}

btn.onclick = () => (mic ? stopMic() : startMic());
wakeSwitch.onchange = () => {
  wakeMode = wakeSwitch.checked;
  try { localStorage.setItem('wakeMode', wakeMode ? '1' : '0'); } catch {}
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'wake_mode', value: wakeMode }));
  idleStatus();
};
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && mic) keepAwake();
});

connect();
</script>
</body>
</html>
