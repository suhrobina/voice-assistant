<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
<title>Voice Assistant</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #8a8a8a; --card: #f4f4f4; --chip: #e6e6e6; --line: #e4e4e4;
    --accent: #1f1f1f; --on-accent: #ffffff; --live: #16a34a; --stop: #dc2626;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171717; --fg: #ececec; --muted: #8e8e8e; --card: #262626; --chip: #363636; --line: #383838;
      --accent: #ececec; --on-accent: #171717; --live: #22c55e; --stop: #ef4444;
      color-scheme: dark;  /* dark scrollbars and form controls */
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 14.5px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  #log, footer { width: 100%; max-width: 760px; margin: 0 auto; }

  /* status line just above the input box: connection dot + status */
  #bar { padding: 0 10px 6px 17px;  /* dot lines up with the text in the box below */ display: flex; align-items: center; gap: 7px; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  #dot.online { background: var(--live); }                 /* connected to the server */
  #dot.live { animation: pulse 1.4s ease-in-out infinite; }  /* listening: gentle pulse */
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
  #status {
    color: var(--muted); flex: 1; min-width: 0; font-size: 12.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dotpad { visibility: hidden; }  /* keeps the width while the dots grow (Connecting. .. ...) */

  /* chat: your messages in a soft bubble, AI replies as plain text */
  #log { flex: 1; overflow-y: auto; padding: 12px 14px 8px; scrollbar-width: thin; }
  .msg { margin: 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .you {
    background: var(--card); padding: 7px 12px; border-radius: 18px;
    max-width: 80%; width: fit-content; margin-left: auto;
  }
  .ai { max-width: 100%; }
  .msg code { font-family: ui-monospace, monospace; font-size: .9em; background: var(--card); padding: 1px 5px; border-radius: 5px; }

  /* composer card (like the Claude app): text on top; memory, profile and the action button below */
  footer { padding: 6px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #form {
    padding: 10px 10px 10px; border: 1px solid var(--line); border-radius: 24px; background: var(--card);
    transition: border-color .15s;
  }
  #form:focus-within { border-color: var(--muted); }
  #text {
    display: block; width: 100%; border: 0; outline: 0; background: none; color: var(--fg); font: inherit;
    padding: 6px 6px; resize: none; height: 32px; max-height: 140px; overflow-y: auto; line-height: 20px;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .row .grow { flex: 1; }
  #text::placeholder { color: var(--muted); }
  .round {
    flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0;
    display: grid; place-items: center; background: var(--accent); color: var(--on-accent);
    cursor: pointer; transition: transform .1s, background .15s;
  }
  .round:active { transform: scale(.92); }
  .round svg { width: 17px; height: 17px; fill: currentColor; }
  #action { width: 40px; height: 40px; }
  #action svg { width: 19px; height: 19px; }
  #action.stop { background: var(--stop); color: #fff; }
  #action.stop svg { width: 12px; height: 12px; }

  /* mute next to the action button: only the microphone (replies keep playing); red slash when muted */
  #muteBtn { width: 40px; height: 40px; background: var(--chip); color: var(--fg); }
  #muteBtn svg { width: 19px; height: 19px; }
  #muteBtn .off, #muteBtn[aria-pressed="true"] .on { display: none; }
  #muteBtn[aria-pressed="true"] .off { display: block; }
  #muteBtn[aria-pressed="true"] { background: var(--stop); color: #fff; }
  #muteBtn:disabled { opacity: .4; cursor: default; }

  /* ☰ menu: a card that pops up above the button */
  #form { position: relative; }
  #menu {
    position: absolute; left: 8px; bottom: calc(100% + 8px); z-index: 5; min-width: 250px; padding: 6px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.22);
    opacity: 0; transform: translateY(6px) scale(.98); transform-origin: bottom left; pointer-events: none;
    transition: opacity .15s, transform .15s;
  }
  #menu.open { opacity: 1; transform: none; pointer-events: auto; }
  #menu .item {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 10px; border: 0; border-radius: 10px;
    background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer;
  }
  #menu .item:hover { background: var(--card); }
  #menu .item[hidden] { display: none; }
  #menu .item:disabled { opacity: .45; cursor: default; }
  #menu .item svg { width: 19px; height: 19px; flex: none; fill: var(--muted); }
  #menu .item span { flex: 1; }
  #menu .item small { color: var(--muted); font-size: 12px; }
  #menu .sep { margin-top: 4px; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; padding-top: 12px; }
  #menu .chev { color: var(--muted); font-weight: 400; font-size: 18px; line-height: 1; }
  .switch { position: relative; flex: none; width: 34px; height: 20px; border-radius: 10px; background: var(--chip); transition: background .15s; }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
  }
  [aria-checked="true"] .switch { background: var(--live); }
  [aria-checked="true"] .switch::after { transform: translateX(14px); }
  #memBtn { width: 40px; height: 40px; background: var(--chip); color: var(--fg); }
  #memBtn[aria-expanded="true"] { background: var(--accent); color: var(--on-accent); }
  #memBtn svg { width: 19px; height: 19px; }
  /* profile button: a pill next to the menu button; opens the profiles panel */
  #profileBtn {
    flex: 0 1 auto; min-width: 0; max-width: 160px; height: 40px; padding: 0 30px 0 16px; border-radius: 20px;  /* shrinks
       (long names end in …), so the mute and talk buttons never move */
    border: 0; outline: 0; background-color: var(--chip); color: var(--fg); font: inherit; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 17px center, right 13px center; background-size: 4px 4px; background-repeat: no-repeat;
  }
  #profileBtn[hidden] { display: none; }
  .note { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0; }

  /* panels (memory, profiles): slide up from the bottom */
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 760px; margin: 0 auto; max-height: 75dvh;
    display: flex; flex-direction: column; background: var(--bg); border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,.18); transform: translateY(105%); transition: transform .22s ease;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  body.sheet-open #shade { opacity: 1; pointer-events: auto; }
  .sheet.open { transform: none; }
  .sheet .top { display: flex; align-items: center; gap: 4px; padding: 12px 14px 6px; }
  .sheet h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; }
  .sheet h2 span { color: var(--muted); font-weight: 400; }
  .plain { border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .plain:hover { background: var(--card); }
  #facts { list-style: none; margin: 0; padding: 0 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; overflow-y: auto; flex: 1; }
  #facts li { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-bottom: 1px solid var(--line);
              border-radius: 8px; transition: background 1.2s; }
  #facts li.new { background: var(--chip); transition: none; }  /* just added or edited: brief highlight */
  #facts li span { flex: 1; overflow-wrap: anywhere; cursor: text; }
  #facts li input {
    flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--card);
    border: 1px solid var(--muted); border-radius: 8px; padding: 4px 8px; outline: 0;
  }
  #facts .empty { color: var(--muted); justify-content: center; text-align: center; border: 0; padding: 18px 0; }
  #addFact { display: flex; gap: 6px; margin: 4px 14px 8px; padding: 4px 4px 4px 14px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); }
  #factText { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--fg); font: inherit; }
  #clearMem { display: block; margin: 4px auto 0; font-size: 12.5px; }
  #clearMem:hover { color: var(--stop); }
  #clearMem[hidden] { display: none; }

  /* profiles panel: list (tap = switch, ✎ = edit) and the editor */
  #profListView, #profForm { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  #profListView[hidden], #profForm[hidden], #profBack[hidden] { display: none; }
  #profList { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  #profList li { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
  .pick {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 11px 6px; border: 0; border-radius: 8px;
    background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer;
  }
  .pick:hover { background: var(--card); }
  .check { width: 14px; flex: none; color: var(--live); font-weight: 700; }
  .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pdesc { flex: none; color: var(--muted); font-size: 12.5px; }
  #profNew { display: block; margin: 8px auto 2px; color: var(--fg); font-size: 14px; }
  #profForm { overflow-y: auto; padding: 0 14px; gap: 12px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); }
  .field > span { display: flex; justify-content: space-between; }
  .field output { color: var(--fg); }
  .field small { font-size: 11.5px; }
  .field input:not([type="range"]):not([type="checkbox"]), .field select, .field textarea {
    font: inherit; font-size: 14.5px; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; outline: 0; min-width: 0;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--muted); }
  .field input:disabled { opacity: .6; }
  .field textarea { resize: vertical; min-height: 120px; line-height: 1.45; }
  .field input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
  .check-row { flex-direction: row; align-items: center; gap: 10px; color: var(--fg); font-size: 14px; cursor: pointer; }
  .check-row > span { display: block; }
  .check-row small { color: var(--muted); font-size: 12px; }
  .check-row input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  .check-row input:disabled + span { opacity: .55; }
  .voice-row { display: flex; gap: 8px; }
  .voice-row select { flex: 1; }
  #pfTest {
    flex: none; height: 38px; padding: 0 14px; border: 0; border-radius: 19px;
    background: var(--chip); color: var(--fg); font: inherit; cursor: pointer;
  }
  #pfTest:disabled { opacity: .5; }
  #pfError { margin: 0; min-height: 1em; color: var(--stop); font-size: 12.5px; }
  .actions { position: sticky; bottom: 0; display: flex; align-items: center; gap: 4px; padding: 8px 0 4px; background: var(--bg); }
  .actions .grow { flex: 1; }
  .danger:hover { color: var(--stop); }
  #pfDup[hidden], #pfDelete[hidden] { display: none; }
  .primary {
    height: 38px; padding: 0 22px; border: 0; border-radius: 19px; cursor: pointer;
    background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600;
  }
  .primary:disabled { opacity: .5; }

  /* lock screen: shown when the server has a password and this browser isn't logged in */
  #lock { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: var(--bg); }
  #lock[hidden] { display: none; }
  #lockForm { width: min(300px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #lockForm svg { width: 34px; height: 34px; fill: var(--muted); }
  #lockForm h1 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  #pw {
    width: 100%; height: 42px; padding: 0 16px; border: 1px solid var(--line); border-radius: 21px; outline: 0;
    background: var(--card); color: var(--fg); font: inherit; text-align: center;
  }
  #pw:focus { border-color: var(--muted); }
  #unlock {
    width: 100%; height: 42px; border: 0; border-radius: 21px; cursor: pointer;
    background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600;
  }
  #lockMsg { min-height: 1.2em; margin: 0; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div id="log"></div>
<footer>
  <div id="bar"><span id="dot"></span><span id="status" role="status">Connecting…</span></div>
  <form id="form">
    <textarea id="text" rows="1" placeholder="Message…" autocomplete="off" enterkeyhint="enter"></textarea>
    <div class="row">
      <button id="memBtn" class="round" type="button" title="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <button id="profileBtn" type="button" hidden aria-label="Profiles">Default</button>
      <span class="grow"></span>
      <button id="muteBtn" class="round" type="button" aria-pressed="false" disabled
              title="Mute the microphone" aria-label="Mute microphone">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>
      </button>
      <button id="action" class="round" type="button" aria-label="Start talking"></button>
    </div>
    <div id="menu" role="menu" aria-hidden="true">
      <button id="newItem" class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <span>New conversation</span></button>
      <button id="memItem" class="item" type="button" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
        <span>Memory</span><b class="chev" aria-hidden="true">›</b></button>
      <button id="useMemItem" class="item" type="button" role="menuitemcheckbox" aria-checked="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
        <span>Use memory</span><i class="switch" aria-hidden="true"></i></button>
      <button id="logItem" class="item" type="button" role="menuitemcheckbox" aria-checked="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        <span>Save conversation log</span><i class="switch" aria-hidden="true"></i></button>
      <button id="wakeItem" class="item" type="button" role="menuitemcheckbox" aria-checked="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 20c-.29 0-.56-.06-.76-.15-.71-.37-1.21-.88-1.71-2.38-.51-1.56-1.47-2.29-2.39-3-.79-.61-1.61-1.24-2.32-2.53C9.29 10.98 9 9.93 9 9c0-2.8 2.2-5 5-5s5 2.2 5 5h2c0-3.93-3.07-7-7-7S7 5.07 7 9c0 1.26.38 2.65 1.07 3.9.91 1.65 1.98 2.48 2.85 3.15.81.62 1.39 1.07 1.71 2.05.6 1.82 1.37 2.84 2.73 3.55.51.23 1.07.35 1.64.35 2.21 0 4-1.79 4-4h-2c0 1.1-.9 2-2 2zM7.64 2.64 6.22 1.22C4.23 3.21 3 5.96 3 9s1.23 5.79 3.22 7.78l1.41-1.41C6.01 13.74 5 11.49 5 9s1.01-4.74 2.64-6.36zM11.5 9c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5-2.5 1.12-2.5 2.5z"/></svg>
        <span id="wakeLabel">Wake word</span><i class="switch" aria-hidden="true"></i></button>
      <button id="logoutItem" class="item sep" type="button" role="menuitem" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        <span>Log out of this device</span></button>
    </div>
  </form>
</footer>
<div id="lock" hidden>
  <form id="lockForm">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9zm3 4a2 2 0 0 1 1 3.73V19h-2v-1.27A2 2 0 0 1 12 14z"/></svg>
    <h1>Voice Assistant</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" enterkeyhint="go" aria-label="Password">
    <button id="unlock" type="submit">Unlock</button>
    <p id="lockMsg" role="status"></p>
  </form>
</div>
<div id="shade"></div>
<section id="sheet" class="sheet" aria-label="Memory" aria-hidden="true">
  <div class="top"><h2>Memory <span id="memCount"></span></h2>
    <button id="memClose" class="plain" type="button" aria-label="Close">✕</button></div>
  <form id="addFact">
    <input id="factText" placeholder="Add a fact, e.g. Has a cat named Luna" autocomplete="off" enterkeyhint="done">
    <button class="round" type="submit" aria-label="Add">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
  </form>
  <ul id="facts"></ul>
  <button id="clearMem" class="plain" type="button">Forget everything</button>
</section>
<section id="profSheet" class="sheet" aria-label="Profiles" aria-hidden="true">
  <div class="top">
    <button id="profBack" class="plain" type="button" hidden aria-label="Back to the list">‹</button>
    <h2 id="profTitle">Profiles</h2>
    <button id="profClose" class="plain" type="button" aria-label="Close">✕</button>
  </div>
  <div id="profListView">
    <ul id="profList"></ul>
    <button id="profNew" class="plain" type="button">+ New profile</button>
  </div>
  <form id="profForm" hidden novalidate>
    <label class="field"><span>Name</span>
      <input id="pfName" maxlength="40" placeholder="e.g. coach (empty = made from the label)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <small>File: profiles/<b id="pfFile">…</b>.md · letters, digits, - and _</small></label>
    <label class="field"><span>Label</span>
      <input id="pfLabel" maxlength="60" placeholder="e.g. Fitness Coach" autocomplete="off"></label>
    <div class="field"><span>Voice</span>
      <div class="voice-row"><select id="pfVoice" aria-label="Voice"></select>
        <button id="pfTest" type="button">▶ Test</button></div></div>
    <label class="field"><span>Speed <output id="pfSpeedOut"></output></span>
      <input id="pfSpeed" type="range" min="0.7" max="1.3" step="0.05"></label>
    <label class="field"><span>Pause between sentences <output id="pfPauseOut"></output></span>
      <input id="pfPause" type="range" min="0" max="0.6" step="0.05"></label>
    <label class="field"><span>Temperature (0.3 focused, 0.9 lively) <output id="pfTempOut"></output></span>
      <input id="pfTemp" type="range" min="0" max="1" step="0.05"></label>
    <label class="field"><span>Silence before it answers <output id="pfSilenceOut"></output></span>
      <input id="pfSilence" type="range" min="0.3" max="2" step="0.05"></label>
    <label class="field"><span>Model</span><select id="pfModel"></select></label>
    <label class="field check-row"><input id="pfThink" type="checkbox">
      <span>Think first <small id="pfThinkNote">(smarter on hard questions, a few seconds slower)</small></span></label>
    <label class="field"><span>Prompt (instructions; replies are spoken, so ask for short sentences)</span>
      <textarea id="pfPrompt" rows="6"></textarea></label>
    <p id="pfError" role="alert"></p>
    <div class="actions">
      <button id="pfDup" class="plain" type="button">Duplicate</button>
      <button id="pfDelete" class="plain danger" type="button">Delete</button>
      <span class="grow"></span>
      <button id="pfSave" class="primary" type="submit">Save</button>
    </div>
  </form>
</section>

<script>
// Mic -> 16 kHz 16-bit PCM chunks, posted to the main thread
const WORKLET = `
class Mic extends AudioWorkletProcessor {
  constructor() { super(); this.ratio = sampleRate / 16000; this.pos = 0;
                  this.buf = new Int16Array(512); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (; this.pos < ch.length; this.pos += this.ratio) {
      const s = Math.max(-1, Math.min(1, ch[Math.floor(this.pos)]));
      this.buf[this.n++] = s * 32767;
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.buffer.slice(0)); this.n = 0; }
    }
    this.pos -= ch.length;
    return true;
  }
}
registerProcessor('mic', Mic);`;

const $ = id => document.getElementById(id);
const statusEl = $('status'), dot = $('dot'), log = $('log');
const form = $('form'), input = $('text'), action = $('action'), wakeBtn = $('wakeItem'), muteBtn = $('muteBtn');
const profileBtn = $('profileBtn'), profSheet = $('profSheet');
const memBtn = $('memBtn'), factsEl = $('facts'), sheet = $('sheet');
const ICONS = {
  mic: '<svg viewBox="0 0 24 24"><rect x="3" y="10" width="2.4" height="4" rx="1.2"/><rect x="7.4" y="6.5" width="2.4" height="11" rx="1.2"/><rect x="11.8" y="3.5" width="2.4" height="17" rx="1.2"/><rect x="16.2" y="7.5" width="2.4" height="9" rx="1.2"/><rect x="20.6" y="10.5" width="2.4" height="3" rx="1.2"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6 3.39 10.1 15 12 3.39 13.9z"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
};

let ws, mic, inCtx, out, wakeLock;
let playTime = 0, sources = [], aiEl = null, aiText = '';
let ignoreAudio = false;  // after "stop", drop late audio until the next reply starts
let wakeName = '';        // e.g. "hey jarvis"; '' = server has no wake word
let wakeMode = false;     // the menu's switch: require the wake word (the server remembers it)
let sleepSound = true;    // server's SLEEP_SOUND: falling tone when it stops listening
let starting = false;     // microphone is being started
let replyEnded = false;   // server sent all audio; tell it "played" once this page is done
let muted = true;         // replies are spoken only while talking (mic on)
let replaced = false;     // another device took over; tapping the status line takes it back
let micMuted = false;     // mute button: the mic sends silence, replies keep playing
let thinkingNow = false;  // "think: on" profile: status shows Thinking… until the first word
let previewing = false;   // "▶ Test" voice sample from the profile editor: played even while muted

// Texts ending in "…" get animated dots: Connecting → Connecting. → Connecting.. → Connecting...
const dotTimers = new Map();
function setDotted(el, text) {
  clearInterval(dotTimers.get(el));
  if (!text.endsWith('…')) { el.textContent = text; return; }
  const shown = document.createElement('span'), pad = document.createElement('span');
  pad.className = 'dotpad';
  el.replaceChildren(text.slice(0, -1), shown, pad);
  let n = 0;
  const tick = () => { shown.textContent = '.'.repeat(n); pad.textContent = '.'.repeat(3 - n); n = (n + 1) % 4; };
  tick();
  dotTimers.set(el, setInterval(tick, 300));  // ms per step; a full cycle = 4 steps
}

function setStatus(text, live = false) {
  setDotted(statusEl, text);
  dot.classList.toggle('online', ws?.readyState === WebSocket.OPEN);
  dot.classList.toggle('live', live && ws?.readyState === WebSocket.OPEN);
}

function idleStatus() {
  if (ws?.readyState !== WebSocket.OPEN) return;
  if (mic && micMuted) setStatus('Mic muted');
  else if (mic && wakeName && wakeMode) setStatus(`💤 Say "${wakeName}"`, true);
  else if (mic) setStatus('Listening...', true);  // "..." = static dots, "…" = animated
  else setStatus('Ready');
}

function add(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// ---- connection (opens on page load, reconnects automatically) ----
// Ask the server first: 204 = open the socket, 401 = password needed (lock screen), no answer = retry
async function connect() {
  let status = 0;
  try { status = (await fetch('/auth', { cache: 'no-store' })).status; } catch {}
  if (status === 401) return showLock(true);
  if (status !== 204) { setStatus('Reconnecting…'); setTimeout(connect, 2000); return; }
  openSocket();
}

function openSocket() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'mute', value: muted }));
    idleStatus();
  };
  ws.onmessage = onMessage;
  ws.onclose = e => {
    stopPlayback();
    if (e.code === 4000) {  // another device (or tab) took over: wait for a tap instead of taking it back
      if (mic) stopMic();
      replaced = true;
      setStatus('In use on another device. Tap here to use it here');
      return;
    }
    setStatus('Reconnecting…');
    setTimeout(connect, 2000);
  };
}

function onMessage(e) {
  if (typeof e.data !== 'string') return play(e.data);
  const m = JSON.parse(e.data);
  if (m.type === 'hello') {
    wakeName = m.wake.replace(/\b\w/g, c => c.toUpperCase());  // "hey jarvis" -> "Hey Jarvis"
    sleepSound = m.sleep_sound !== false;
    wakeBtn.hidden = !wakeName;
    $('wakeLabel').textContent = `Wake word "${wakeName}"`;
    memoryOn = !!m.memory;
    $('memItem').hidden = $('useMemItem').hidden = !memoryOn;  // MEMORY=0 on the server
    showMemoryUse(m.memory_use !== false);
    $('logoutItem').hidden = !m.password;
    showLogging(m.log !== false);
    $('logItem').disabled = !!m.log_locked;  // LOG=0 on the server: always off
    wakeMode = !!m.wake_mode;
    showWakeMode();
    idleStatus();
  }
  else if (m.type === 'wake') onWake(m.state);
  else if (m.type === 'profile') add('note', `— ${m.label} —`);  // the conversation continues
  else if (m.type === 'wake_mode') { wakeMode = !!m.value; showWakeMode(); idleStatus(); }
  else if (m.type === 'memory_use') {
    showMemoryUse(m.value);
    add('note', m.value ? '— memory on —' : '— memory off —');
  }
  else if (m.type === 'log') {
    showLogging(m.value);
    add('note', m.value ? '— saving again —' : '— private: not saved —');
  }
  else if (m.type === 'new_conversation') { log.replaceChildren(); aiEl = null; aiText = ''; }  // clean chat
  else if (m.type === 'profiles') onProfiles(m);
  else if (m.type === 'profile_saved') { $('pfSave').disabled = false; showProfileList(); }
  else if (m.type === 'profile_error') { $('pfSave').disabled = false; $('pfTest').disabled = false; $('pfError').textContent = m.error; }
  else if (m.type === 'preview') { previewing = true; ignoreAudio = false; stopPlayback(); }
  else if (m.type === 'preview_end') { previewing = false; $('pfTest').disabled = false; }
  else if (m.type === 'memory') onMemory(m);
  else if (m.type === 'end' && !previewing) { replyEnded = true; reportPlayed(); }
  else if (m.type === 'stop') {
    ignoreAudio = true; stopPlayback();
    if (thinkingNow) { thinkingNow = false; idleStatus(); }
  }
  else if (m.type === 'user') { add('you', m.text); }
  else if (m.type === 'reply') { ignoreAudio = false; replyEnded = false; aiText = ''; aiEl = add('ai', ''); }
  else if (m.type === 'thinking') { thinkingNow = true; setStatus('Thinking…', true); }
  else if (m.type === 'token' && aiEl) {
    if (thinkingNow) { thinkingNow = false; idleStatus(); }
    aiText += m.text;
    aiEl.innerHTML = format(aiText);
    log.scrollTop = log.scrollHeight;
  }
}

// ---- voice replies: 24 kHz 16-bit PCM, scheduled back to back ----
// Simple formatting for AI replies: **bold**, *italic*, ~~strike~~, `code`, # headings, - / * bullets.
// The text is HTML-escaped first, so nothing the model writes can inject markup.
function format(text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc
    .replace(/^[ \t]*#{1,6}[ \t]+(.+)$/gm, '<b>$1</b>')
    .replace(/^([ \t]*)[-*][ \t]+/gm, '$1• ')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/__(.+?)__/g, '<b>$1</b>')
    .replace(/(^|[^\w*])\*(?=\S)([^*\n]*?\S)\*(?![\w*])/g, '$1<i>$2</i>')   // *italic*
    .replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g, '$1<i>$2</i>')        // _italic_ (not snake_case)
    .replace(/~~(.+?)~~/g, '<s>$1</s>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>');
}

// ---- wake word ("Hey Jarvis"): state comes from the server ----
function onWake(state) {
  if (!mic || !wakeMode) return;
  if (state === 'listening') { setStatus('Listening...', true); chime(); }
  else if (state === 'window') setStatus('Go ahead...', true);
  else {  // "sleep": the wake word is needed again (not while a reply is still playing)
    if (sleepSound && !sources.length) chime(SLEEP_NOTES, 0.15);
    idleStatus();
  }
}

// Short soft tones, same as on the PC: one high note = listening, two falling = stopped listening
const SLEEP_NOTES = [[660, 0.1], [440, 0.14]];
function chime(notes = [[880, 0.12]], volume = 0.25) {
  if (!out || muted) return;
  let t = out.currentTime;
  for (const [freq, secs] of notes) {
    const osc = out.createOscillator(), gain = out.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume, t + 0.03);
    gain.gain.linearRampToValueAtTime(0, t + secs);
    osc.connect(gain).connect(out.destination);
    osc.start(t); osc.stop(t + secs + 0.01);
    t += secs;
  }
}

function reportPlayed() {  // reply fully played -> server opens the follow-up window
  if (replyEnded && !sources.length && ws?.readyState === WebSocket.OPEN) {
    replyEnded = false;
    ws.send(JSON.stringify({ type: 'played' }));
  }
}

function ensureOut() {  // browsers allow audio only after a tap
  if (!out) out = new AudioContext();
  if (out.state === 'suspended') out.resume();
}

function play(buf) {
  if ((muted && !previewing) || ignoreAudio || !out) return;
  const pcm = new Int16Array(buf, 0, buf.byteLength >> 1);
  if (!pcm.length) return;
  const audio = out.createBuffer(1, pcm.length, 24000);
  const data = audio.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) data[i] = pcm[i] / 32768;
  const src = out.createBufferSource();
  src.buffer = audio;
  src.connect(out.destination);
  playTime = Math.max(playTime, out.currentTime + 0.03);
  src.start(playTime);
  playTime += audio.duration;
  sources.push(src);
  src.onended = () => { sources = sources.filter(s => s !== src); reportPlayed(); };
}

function stopPlayback() {
  sources.forEach(s => { try { s.stop(); } catch {} });
  sources = [];
  playTime = 0;
}

function setMuted(value) {
  muted = value;
  if (muted) stopPlayback(); else ensureOut();
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'mute', value: muted }));
}

// ---- the one action button: wave = start talking / ➤ send (text typed) / ■ stop talking ----
function actionMode() {
  if (input.value.trim()) return 'send';
  return mic ? 'stop' : 'mic';
}

function updateAction() {
  const mode = actionMode();
  if (action.dataset.mode === mode) return;
  action.dataset.mode = mode;
  action.innerHTML = ICONS[mode];
  action.classList.toggle('stop', mode === 'stop');
  action.setAttribute('aria-label', { mic: 'Start talking', send: 'Send', stop: 'Stop talking' }[mode]);
  input.placeholder = !mic ? 'Message…' : micMuted ? 'Mic muted. Type a message' : 'Listening… or type';
}

function sendText() {
  const text = input.value.trim();
  if (!text || ws?.readyState !== WebSocket.OPEN) return;
  ensureOut();
  ws.send(JSON.stringify({ type: 'text', text }));
  input.value = '';
  fitInput();
  updateAction();
}

function fitInput() {  // grow with the text, up to max-height (then it scrolls)
  input.style.height = '32px';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}

form.onsubmit = e => e.preventDefault();
input.oninput = () => { fitInput(); updateAction(); };
input.onkeydown = e => {  // Enter = new line; Ctrl/Cmd+Enter = send (keyboard shortcut)
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendText(); }
};
action.onclick = () => {
  if (starting) return;
  const mode = actionMode();
  if (mode === 'send') sendText();
  else if (mode === 'stop') stopMic();
  else startMic();
};

// ---- microphone ----
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}

async function startMic() {
  if (!window.isSecureContext) {
    setStatus('The Mic needs https://');
    return;
  }
  starting = true;
  setStatus('Starting Mic…');
  try {
    ensureOut();
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    try { inCtx = new AudioContext({ sampleRate: 16000 }); } catch { inCtx = new AudioContext(); }
    const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
    await inCtx.audioWorklet.addModule(url);
    const node = new AudioWorkletNode(inCtx, 'mic', { numberOfOutputs: 0 });
    inCtx.createMediaStreamSource(mic).connect(node);
    node.port.onmessage = e => { if (ws?.readyState === WebSocket.OPEN) ws.send(e.data); };
    setMuted(false);
    muteBtn.disabled = false;
    updateAction();
    keepAwake();
    idleStatus();
  } catch (err) {
    stopMic();
    setStatus(err.name === 'NotAllowedError' ? 'Mic permission denied' : 'Error: ' + err.message);
  }
  starting = false;
}

function stopMic() {
  mic?.getTracks().forEach(t => t.stop()); mic = null;
  muteBtn.disabled = true;
  setMicMuted(false);
  inCtx?.close(); inCtx = null;
  wakeLock?.release(); wakeLock = null;
  setMuted(true);
  updateAction();
  idleStatus();
}

function showWakeMode() {
  wakeBtn.setAttribute('aria-checked', String(wakeMode));
}

// ---- mute: only the microphone. A disabled track sends silence, so a sentence in progress ends cleanly
function setMicMuted(on) {
  micMuted = on && !!mic;
  mic?.getAudioTracks().forEach(t => { t.enabled = !micMuted; });
  muteBtn.setAttribute('aria-pressed', String(micMuted));
  muteBtn.title = micMuted ? 'Unmute the microphone' : 'Mute the microphone';
  action.dataset.mode = '';  // refresh the placeholder
  updateAction();
  idleStatus();
}
muteBtn.onclick = () => setMicMuted(!micMuted);

// ---- ☰ menu: New conversation, Memory, memory/log/wake word switches, Log out ----
const menu = $('menu');
function showMenu(open) {
  menu.classList.toggle('open', open);
  menu.setAttribute('aria-hidden', String(!open));
  memBtn.setAttribute('aria-expanded', String(open));
}
memBtn.onclick = () => showMenu(!menu.classList.contains('open'));
document.addEventListener('click', e => {  // tap outside closes it
  if (menu.classList.contains('open') && !menu.contains(e.target) && !memBtn.contains(e.target)) showMenu(false);
});
$('memItem').onclick = () => { showMenu(false); showMemory(true); };
$('bar').onclick = () => {
  if (!replaced) return;
  replaced = false;
  setStatus('Connecting…');
  connect();
};

// "Use memory" off: the AI ignores the facts and learns nothing (they stay in memory.md)
function showMemoryUse(on) { $('useMemItem').setAttribute('aria-checked', String(on)); }
$('useMemItem').onclick = () => wsSend({ type: 'memory_use', value: $('useMemItem').getAttribute('aria-checked') !== 'true' });

// "Save conversation log" off = private mode: the server writes nothing to conversations/
function showLogging(on) {
  $('logItem').setAttribute('aria-checked', String(on));
}
$('logItem').onclick = () => wsSend({ type: 'log', value: $('logItem').getAttribute('aria-checked') !== 'true' });
$('newItem').onclick = () => { showMenu(false); wsSend({ type: 'new_conversation' }); };

// ---- memory panel: the facts in memory/memory.md ----
function wsSend(msg) { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); }

function onMemory(m) {
  if (m.learned) {  // the AI picked it up from the conversation: show it in the chat
    for (const f of m.added) add('note', `🧠 Remembered: ${f}`);
    for (const f of m.removed) add('note', `🧠 Forgot: ${f}`);
  }
  facts = m.facts;
  if (!editing) {  // while editing, the list waits (re-render would lose the typing)
    renderFacts();
    showNew(m.added);
  }
}

let facts = [], editing = false, memoryOn = true;

function renderFacts() {
  $('memCount').textContent = `· ${facts.length} fact${facts.length === 1 ? '' : 's'}`;
  factsEl.innerHTML = '';
  if (!facts.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'Nothing yet. Tell it about yourself, or add a fact below.';
    factsEl.appendChild(li);
  }
  for (const f of facts) {
    const li = document.createElement('li'), span = document.createElement('span'), x = document.createElement('button');
    span.textContent = f;
    span.title = 'Tap to edit';
    span.onclick = () => editFact(span, f);
    x.className = 'plain'; x.type = 'button'; x.textContent = '✕'; x.title = 'Forget this';
    x.onclick = () => wsSend({ type: 'memory_remove', fact: f });
    li.append(span, x);
    factsEl.appendChild(li);
  }
  $('clearMem').hidden = !facts.length;
}

// Scroll to the fact that was just added or edited and highlight it for a moment
function showNew(added) {
  const li = [...factsEl.children].reverse().find(li => added.includes(li.firstChild?.textContent));
  if (!li) return;
  li.classList.add('new');
  li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  setTimeout(() => li.classList.remove('new'), 900);
}

// Tap a fact to edit it: Enter or tapping elsewhere saves, Esc cancels, empty = forget it
function editFact(span, old) {
  const box = document.createElement('input');
  box.value = old;
  box.enterKeyHint = 'done';
  span.replaceWith(box);
  box.focus();
  editing = true;
  let done = false;
  const finish = save => {
    if (done) return;
    done = true;
    editing = false;
    const fact = box.value.trim();
    if (save && fact !== old) wsSend({ type: 'memory_edit', old, fact });
    renderFacts();  // the server sends the updated list right after
  };
  box.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
  };
  box.onblur = () => finish(true);
  const x = box.parentElement.querySelector('button');  // ✕ while editing: forget it in one tap
  x.onmousedown = e => e.preventDefault();               // keep focus, so blur doesn't save first
  x.onclick = () => { finish(false); wsSend({ type: 'memory_remove', fact: old }); };
}

// ---- panels: one open at a time, sliding up over a shade ----
function openSheet(s) {
  closeSheets();
  s.classList.add('open');
  s.setAttribute('aria-hidden', 'false');
  document.body.classList.add('sheet-open');
}

function closeSheets() {
  for (const s of document.querySelectorAll('.sheet.open')) {
    s.classList.remove('open');
    s.setAttribute('aria-hidden', 'true');
  }
  document.body.classList.remove('sheet-open');
}

function showMemory(open) {
  if (!open) return closeSheets();
  openSheet(sheet);
  if (memoryOn) wsSend({ type: 'memory' });
}

$('memClose').onclick = $('profClose').onclick = $('shade').onclick = closeSheets;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheets(); showMenu(false); } });
$('addFact').onsubmit = e => {
  e.preventDefault();
  const fact = $('factText').value.trim();
  if (fact) wsSend({ type: 'memory_add', fact });
  $('factText').value = '';
};
$('clearMem').onclick = () => {
  if (confirm('Forget everything it knows about you?')) wsSend({ type: 'memory_clear' });
};

// ---- profiles panel: tap a row = switch, ✎ = edit, + New profile (from profiles/_template.md) ----
let profiles = { list: [], current: '', template: null, voices: [], models: [], default_model: '' };
let editingProfile = null;  // name of the profile in the editor; '' = a new one

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function onProfiles(m) {
  profiles = m;
  const current = m.list.find(p => p.name === m.current);
  profileBtn.textContent = current?.label || m.current;
  profileBtn.title = profileBtn.textContent;  // the full name, if it's cut off
  profileBtn.hidden = false;
  renderProfiles();
}

function renderProfiles() {
  const ul = $('profList');
  ul.innerHTML = '';
  for (const p of profiles.list) {
    const li = el('li'), pick = el('button', 'pick'), edit = el('button', 'plain', '✎');
    pick.type = edit.type = 'button';
    pick.append(el('span', 'check', p.name === profiles.current ? '✓' : ''), el('span', 'pname', p.label),
                el('span', 'pdesc', p.voice));
    pick.onclick = () => {
      if (p.name !== profiles.current) wsSend({ type: 'profile', name: p.name });
      closeSheets();
    };
    edit.title = 'Edit';
    edit.setAttribute('aria-label', `Edit ${p.label}`);
    edit.onclick = () => fillEditor(p, p.name);
    li.append(pick, edit);
    ul.append(li);
  }
}

function showProfileList() {
  editingProfile = null;
  $('profTitle').textContent = 'Profiles';
  $('profBack').hidden = $('profForm').hidden = true;
  $('profListView').hidden = false;
}

const f = {
  name: $('pfName'), label: $('pfLabel'), voice: $('pfVoice'), speed: $('pfSpeed'), pause: $('pfPause'),
  temperature: $('pfTemp'), silence: $('pfSilence'), model: $('pfModel'), think: $('pfThink'), prompt: $('pfPrompt'),
};

function slugify(text) { return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40); }

function showValues() {
  $('pfSpeedOut').textContent = `${Number(f.speed.value).toFixed(2)}×`;
  $('pfPauseOut').textContent = `${Number(f.pause.value).toFixed(2)} s`;
  $('pfTempOut').textContent = Number(f.temperature.value).toFixed(2);
  $('pfSilenceOut').textContent = `${Number(f.silence.value).toFixed(2)} s`;
  $('pfFile').textContent = f.name.value.trim() || slugify(f.label.value) || '…';
}

function setOptions(select, items, value) {  // items: [[value, text]]; keeps an unknown current value
  select.innerHTML = '';
  if (value && !items.some(([v]) => v === value)) items = [[value, value], ...items];
  for (const [v, text] of items) select.add(new Option(text, v));
  select.value = value;
}

// p: the profile's values; old: its name ('' = new). Opens the editor view.
function fillEditor(p, old) {
  editingProfile = old;
  $('profTitle').textContent = old ? 'Edit profile' : 'New profile';
  $('profBack').hidden = $('profForm').hidden = false;
  $('profListView').hidden = true;
  f.label.value = p.label || '';
  f.name.value = p.name || '';
  f.name.disabled = old === 'default';  // the fallback profile keeps its name
  setOptions(f.voice, profiles.voices.map(v => [v.name, `${v.name} (${v.desc})`]), p.voice);
  setOptions(f.model, [['', `Default (${profiles.default_model})`], ...profiles.models.map(m => [m, m])], p.model || '');
  f.speed.value = p.speed; f.pause.value = p.pause; f.temperature.value = p.temperature; f.silence.value = p.silence;
  f.think.checked = !!p.think;
  updateThink();
  f.prompt.value = p.prompt || '';
  $('pfDelete').hidden = !old || old === 'default';
  $('pfDup').hidden = !old;
  $('pfError').textContent = '';
  $('pfSave').disabled = false;
  showValues();
  $('profForm').scrollTop = 0;
}

// "Think first" only for models that can (Ollama reports it; qwen3 yes, llama3.2/qwen2.5 no)
function updateThink() {
  const model = f.model.value || profiles.default_model;
  const can = (profiles.thinking_models || []).includes(model);
  f.think.disabled = !can;
  if (!can) f.think.checked = false;
  $('pfThinkNote').textContent = can ? '(smarter on hard questions, a few seconds slower)' : `(${model} can't)`;
}

function editorData() {
  const data = {};
  for (const [k, input] of Object.entries(f)) data[k] = input.type === 'checkbox' ? input.checked : input.value;
  data.name = data.name.trim() || slugify(data.label);
  return data;
}

profileBtn.onclick = () => {
  showProfileList();
  openSheet(profSheet);
  wsSend({ type: 'profiles' });  // fresh list (files may have changed)
};
$('profBack').onclick = showProfileList;
$('profNew').onclick = () => fillEditor({ ...profiles.template, name: '', label: '' }, '');
for (const input of [f.speed, f.pause, f.temperature, f.silence, f.name, f.label]) input.oninput = showValues;
f.model.onchange = updateThink;
$('profForm').onsubmit = e => {
  e.preventDefault();
  $('pfError').textContent = '';
  $('pfSave').disabled = true;
  wsSend({ type: 'profile_save', old: editingProfile || null, data: editorData() });
};
$('pfDelete').onclick = () => {
  if (confirm(`Delete the profile "${f.label.value || editingProfile}"?`)) {
    wsSend({ type: 'profile_delete', name: editingProfile });
    showProfileList();
  }
};
$('pfDup').onclick = () => {
  const d = editorData();
  fillEditor({ ...d, name: `${d.name}-copy`.slice(0, 40), label: `${d.label} (copy)` }, '');
};
$('pfTest').onclick = () => {
  ensureOut();  // audio needs a tap first
  $('pfError').textContent = '';
  $('pfTest').disabled = true;
  setTimeout(() => { $('pfTest').disabled = false; }, 8000);  // in case no answer comes
  wsSend({ type: 'profile_preview', data: { voice: f.voice.value, speed: f.speed.value, pause: f.pause.value, label: f.label.value } });
};

// ---- password (WEB_PASSWORD on the server): log in once, a cookie remembers this browser ----
function showLock(on) {
  $('lock').hidden = !on;
  if (on) setTimeout(() => $('pw').focus(), 50);
}

$('lockForm').onsubmit = async e => {
  e.preventDefault();
  const msg = $('lockMsg'), pw = $('pw').value;
  if (!pw) return;
  setDotted(msg, 'Checking…');
  let r;
  try {  // encoded: header values must be plain ASCII
    r = await fetch('/login', { headers: { 'X-Password': encodeURIComponent(pw) }, cache: 'no-store' });
  } catch { setDotted(msg, 'Server not reachable'); return; }
  if (r.ok) {
    $('pw').value = ''; setDotted(msg, '');
    showLock(false);
    connect();
  } else if (r.status === 429) setDotted(msg, `Too many tries. Wait ${(await r.text()).trim()} s`);
  else { setDotted(msg, 'Wrong password'); $('pw').select(); }
};

$('logoutItem').onclick = async () => {
  showMenu(false);
  try { await fetch('/logout', { cache: 'no-store' }); } catch {}
  closeSheets();
  if (mic) stopMic();
  ws?.close();  // reconnecting finds no cookie -> lock screen
};

wakeBtn.onclick = () => {
  wakeMode = !wakeMode;
  showWakeMode();
  wsSend({ type: 'wake_mode', value: wakeMode });  // the server saves it and confirms
  idleStatus();
};
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && mic) keepAwake();
});

showWakeMode();
updateAction();
setStatus('Connecting…');  // animate from the start
connect();
</script>
</body>
</html>
